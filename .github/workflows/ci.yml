name: Modernization Platform Continuous Integration (W02)

on:
  push:
    branches: [main, master, "remediation/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Code Formatting & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Verify Code Formatting
        run: |
          black --check backend/app backend/tests

  backend-security-and-isolation:
    name: Hermetic Security Negative & Isolation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify Production DB Address Refusal (TEST-04 Guard)
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); from app.core.testing_infrastructure import IsolationGuard, ProtectedResourceError;
          try:
              IsolationGuard.verify_database_url('postgresql://user:pass@localhost:5432/rebase')
              sys.exit(1)
          except ProtectedResourceError:
              print('PROD DB ACCESS PROPERLY BLOCKED')
          "

      - name: Run Hermetic Unit & Security Negative Tests
        run: |
          cd backend
          python -m pytest -c pytest.ini tests/test_w02_isolation_and_ci.py -m "unit or security_negative" --junitxml=../.test_runs/junit-unit.xml

  disposable-db-integration:
    name: Disposable PostgreSQL Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postres123
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install psycopg2-binary pytest pytest-asyncio

      - name: Run Disposable DB Lifecycle & Migration Verification
        env:
          POSTGRES_ADMIN_URL: "postgresql://postgres:postres123@localhost:5432/postgres"
          DATABASE_URL: "postgresql+asyncpg://postgres:postres123@localhost:5432/rebase_test_ci"
          ENVIRONMENT: "testing"
        run: |
          cd backend
          python -m pytest -c pytest.ini tests/test_w02_isolation_and_ci.py -m "db_integration" --junitxml=../.test_runs/junit-db.xml

  frontend-test-and-build:
    name: Frontend Vitest & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: Build Production Frontend Assets
        working-directory: frontend
        run: npm run build


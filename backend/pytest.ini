[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --basetemp=.pytest_temp -ra -v --junitxml=.test_runs/junit.xml -rsxX
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: Fast hermetic unit tests with zero external dependencies
    db_integration: Integration tests requiring disposable PostgreSQL database
    sandbox_real: Acceptance tests executed in an isolated sandbox environment
    security_negative: Negative security, attack vector, and privilege-escalation tests
    e2e_fixture: End-to-end modernization flows against synthetic reference fixtures
    e2e_real_model: End-to-end flows with real model provider (budget capped, disabled by default)
    chaos: Fault injection, lease expiration, and outbox failure resilience tests
